services:
  zrouter-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    environment:
      NVIDIA_API_KEYS: ${NVIDIA_API_KEYS:?NVIDIA_API_KEYS must be configured}
      NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
      NVIDIA_RPM: "35"
      NVIDIA_CACHE_TTL: "3600"
      NVIDIA_TIMEOUT: "90"
      NVIDIA_MAX_WAIT: "60"
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8000"
      ROUTER_TOKEN: ${ROUTER_TOKEN:?ROUTER_TOKEN must be configured}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
