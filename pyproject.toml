[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zrouter"
version = "1.0.0"
description = "Free-only router for NVIDIA hosted NIM endpoints with model fallback, multi-key rotation, auto routing, streaming, cache, stats, and an OpenAI-compatible proxy."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "cvsz", email = "cvsz@zrouter.dev" },
]
license = { text = "MIT" }
keywords = ["nvidia", "nim", "router", "proxy", "llm", "openai", "api", "chat"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests>=2.31",
    "keyring>=25.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.17.0",
    "pyinstaller>=6.0",
    "textual>=0.79.0",
    "rich>=13.0.0",
]
web = [
    "flask>=3.0",
    "gunicorn>=22.0",
]

[project.scripts]
zrouter = "zrouter:main"
zcloud = "zrouter:main"

[tool.setuptools]
py-modules = ["zrouter", "zrouter_contracts", "zrouter_http", "zrouter_core", "zrouter_bot", "zrouter_bot_models", "zrouter_bot_storage", "zrouter_runtime"]

[tool.setuptools.package-data]
zrouter = ["*.json", "*.ico", "*.png"]
