<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zrouter — NVIDIA Free-Model Router Dashboard</title>
<link rel="icon" type="image/png" href="/static/img/nvidia.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0c;
    --bg-gradient: linear-gradient(135deg, #0a0a0c 0%, #1a1a2e 50%, #0a0a0c 100%);
    --panel: rgba(26, 26, 46, 0.7);
    --panel-border: rgba(212, 175, 55, 0.3);
    --text: #f5f5f0;
    --muted: #b8b8a8;
    --accent: #d4af37;
    --accent-glow: rgba(212, 175, 55, 0.4);
    --accent-hover: #e8c55a;
    --gold-light: #f0e6a8;
    --danger: #ff6b6b;
    --success: #4ade80;
    --warning: #fbbf24;
    --glass: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(212, 175, 55, 0.2);
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Thai', sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
    pointer-events: none;
    z-index: -1;
  }
  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 32px;
    border-bottom: 1px solid var(--glass-border);
    background: rgba(10, 10, 12, 0.8);
    backdrop-filter: blur(12px);
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  header img {
    width: 32px;
    height: 32px;
    filter: drop-shadow(0 0 8px var(--accent-glow));
  }
  header h1 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
    text-shadow: 0 0 10px var(--accent-glow);
  }
  header .spacer { margin-left: auto; }
  header .chip {
    font-size: 0.72rem;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--glass);
    color: var(--gold-light);
    border: 1px solid var(--glass-border);
    margin-right: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  header .locale-selector {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  header .locale-selector button {
    padding: 4px 8px;
    font-size: 0.7rem;
    background: transparent;
    border: 1px solid var(--glass-border);
    color: var(--muted);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  header .locale-selector button:hover {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(212, 175, 55, 0.05);
  }
  header .locale-selector button.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }

  /* ---------- Nav ---------- */
  nav {
    display: flex;
    border-bottom: 1px solid var(--glass-border);
    background: rgba(26, 26, 46, 0.4);
    backdrop-filter: blur(8px);
    flex-shrink: 0;
  }
  nav a {
    padding: 14px 24px;
    font-size: 0.85rem;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    transition: all 0.3s ease;
    position: relative;
  }
  nav a::before {
    content: "";
    position: absolute;
    bottom: 0; left: 50%; right: 50%;
    height: 2px;
    background: var(--accent);
    transition: all 0.3s ease;
    opacity: 0;
  }
  nav a:hover {
    color: var(--text);
    background: rgba(212, 175, 55, 0.05);
  }
  nav a.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  nav a.active::before {
    left: 0; right: 0;
    opacity: 1;
  }

  /* ---------- Main ---------- */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px;
  }
  section {
    display: none;
    animation: fadeIn 0.4s ease;
  }
  section.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Overview ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }
  .card {
    background: var(--panel);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 24px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }
  .card:hover {
    border-color: var(--panel-border);
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  }
  .card h3 {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card h3 .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
  }
  .dot.ok { background: var(--success); box-shadow: 0 0 8px rgba(74, 222, 128, 0.4); }
  .dot.warn { background: var(--warning); box-shadow: 0 0 8px rgba(251, 191, 36, 0.4); }
  .dot.bad { background: var(--danger); box-shadow: 0 0 8px rgba(255, 107, 107, 0.4); }
  .big {
    font-size: 2.2rem;
    font-weight: 800;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #fff, var(--gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .small {
    font-size: 0.82rem;
    color: var(--muted);
  }
  .key-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .key-row:last-child { border-bottom: none; }
  .key-masked {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.8rem;
    flex: 1;
    color: var(--gold-light);
  }
  .key-stats {
    display: flex;
    gap: 16px;
    font-size: 0.75rem;
    color: var(--muted);
  }

  /* ---------- Models ---------- */
  .route-section { margin-bottom: 28px; }
  .route-section h4 {
    font-size: 0.85rem;
    color: var(--accent);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--glass-border);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .model-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .model-card {
    background: var(--panel);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .model-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 4px; height: 100%;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .model-card:hover {
    border-color: var(--panel-border);
    background: rgba(212, 175, 55, 0.05);
    transform: translateX(6px);
  }
  .model-card:hover::before { opacity: 1; }
  .model-card .id {
    font-family: ui-monospace, monospace;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .model-card .name {
    font-weight: 700;
    margin-top: 6px;
    color: var(--text);
  }
  .empty {
    color: var(--muted);
    font-style: italic;
    padding: 30px;
    text-align: center;
  }

  /* ---------- Chat ---------- */
  .chat-wrap {
    display: flex;
    height: calc(100vh - 160px);
    gap: 20px;
  }
  .chat-sidebar {
    width: 340px;
    border: 1px solid var(--glass-border);
    background: var(--panel);
    backdrop-filter: blur(12px);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-sidebar h3 {
    padding: 16px 20px;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--glass-border);
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .chat-history {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chat-msg {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .chat-msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: #000;
    border-bottom-right-radius: 4px;
  }
  .chat-msg.assistant {
    align-self: flex-start;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    border-bottom-left-radius: 4px;
  }
  .chat-msg .model {
    font-size: 0.68rem;
    opacity: 0.7;
    margin-bottom: 4px;
    display: block;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .chat-msg.system {
    align-self: center;
    font-size: 0.75rem;
    color: var(--muted);
    background: transparent;
    border: none;
    padding: 4px 12px;
    max-width: 100%;
  }
  .chat-input-area {
    padding: 16px 20px;
    border-top: 1px solid var(--glass-border);
    background: rgba(10, 10, 12, 0.6);
  }
  .chat-input-wrap {
    display: flex;
    gap: 10px;
  }
  .chat-input-wrap textarea {
    flex: 1;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    color: var(--text);
    padding: 12px 16px;
    font-size: 0.9rem;
    resize: vertical;
    min-height: 48px;
  }
  .chat-input-wrap textarea:focus {
    outline: none;
    border-color: var(--panel-border);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .chat-send {
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 0 26px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 0.85rem;
  }
  .chat-send:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px var(--accent-glow);
  }
  .chat-send:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .chat-controls {
    padding: 20px;
    border-top: 1px solid var(--glass-border);
    background: rgba(10, 10, 12, 0.6);
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .chat-controls label {
    font-size: 0.78rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chat-controls select,
  .chat-controls input[type=text] {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    color: var(--text);
    padding: 6px 10px;
    font-size: 0.8rem;
  }
  .chat-controls select:focus,
  .chat-controls input[type=text]:focus {
    outline: none;
    border-color: var(--panel-border);
  }
  .chat-error {
    color: var(--danger);
    font-size: 0.8rem;
    margin-top: 8px;
  }

  /* ---------- Stats ---------- */
  .stat-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
  }
  .stat-table th {
    text-align: left;
    padding: 12px;
    font-size: 0.75rem;
    color: var(--accent);
    border-bottom: 1px solid var(--glass-border);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .stat-table td {
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    font-size: 0.88rem;
  }
  .stat-table tr:hover {
    background: rgba(212, 175, 55, 0.03);
  }
  .stat-table .mono {
    font-family: ui-monospace, monospace;
    font-size: 0.82rem;
    color: var(--gold-light);
  }

  /* ---------- Utilities ---------- */
  .btn {
    background: var(--panel);
    border: 1px solid var(--glass-border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover {
    border-color: var(--panel-border);
    background: rgba(212, 175, 55, 0.1);
  }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: #000;
    border-color: var(--accent);
  }
  .badge {
    display: inline-block;
    font-size: 0.68rem;
    padding: 3px 10px;
    border-radius: 12px;
    background: var(--glass);
    color: var(--gold-light);
    border: 1px solid var(--glass-border);
    margin-left: 6px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--muted);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 6px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .hidden { display: none !important; }

  @media (max-width: 900px) {
    .chat-wrap {
      flex-direction: column;
      height: auto;
    }
    .chat-sidebar {
      width: 100%;
      height: 320px;
      border-right: none;
      border-bottom: 1px solid var(--glass-border);
    }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <img src="/static/img/nvidia.png" alt="NVIDIA">
    <h1>zrouter</h1>
    <div class="spacer">
      <span class="chip" id="chip-status"><span class="dot bad"></span>connecting</span>
      <span class="chip" id="chip-keys">0 keys</span>
    </div>
    <div class="locale-selector">
      <button id="locale-en" class="active" data-i18n-key="language_en">EN</button>
      <button id="locale-zh" data-i18n-key="language_zh">中文</button>
    </div>
  </header>

  <nav>
    <a href="#overview" onclick="show('overview')">Overview</a>
    <a href="#models" onclick="show('models')">Models</a>
    <a href="#chat" onclick="show('chat')">Chat</a>
    <a href="#stats" onclick="show('stats')">Stats</a>
  </nav>

  <main>
    <!-- Overview -->
    <section id="overview" class="active">
      <h3 style="margin-bottom:16px;font-size:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;" data-i18n-key="router_status"></h3>
      <div class="grid">
        <div class="card">
          <h3><span class="dot" id="dot-health"></span><span data-i18n-key="health"></span></h3>
          <div class="big" id="health-text">—</div>
          <div class="small" id="health-detail"></div>
        </div>
        <div class="card">
          <h3><span data-i18n-key="api_keys"></span></h3>
          <div class="big" id="key-count">—</div>
          <div class="small" id="key-detail">loading…</div>
        </div>
        <div class="card">
          <h3><span data-i18n-key="routes"></span></h3>
          <div class="big" id="route-count">—</div>
          <div class="small" id="route-detail">loading…</div>
        </div>
        <div class="card">
          <h3>Version</h3>
          <div class="big">1.0.0</div>
          <div class="small">NVIDIA Free-Model Router</div>
        </div>
      </div>
      <div class="card" style="margin-top:0;">
        <h3><span data-i18n-key="key_details"></span></h3>
        <div id="key-list" style="display:flex;flex-direction:column;gap:6px;"></div>
      </div>
    </section>

    <!-- Models -->
    <section id="models">
      <h3 style="margin-bottom:16px;font-size:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;" data-i18n-key="allowlisted_models_by_route"></h3>
      <div id="models-grid"></div>
    </section>

    <!-- Chat -->
    <section id="chat">
      <div class="chat-wrap">
        <div class="chat-sidebar">
          <h3 data-i18n-key="conversation"></h3>
          <div class="chat-history" id="chat-history">
            <div class="chat-msg system" data-i18n-key="router_ready_send_message"></div>
          </div>
          <div class="chat-input-area">
            <div class="chat-input-wrap">
              <textarea id="chat-prompt" placeholder="Type a message…"></textarea>
              <button class="send chat-send" id="chat-send">Send</button>
            </div>
            <div class="chat-error" id="chat-error"></div>
          </div>
        </div>
        <div class="chat-main">
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-controls">
            <label><span data-i18n-key="route"></span>: <select id="chat-route">
              <option value="auto"><span data-i18n-key="auto"></span></option>
              <option value="general"><span data-i18n-key="general"></span></option>
              <option value="code"><span data-i18n-key="code"></span></option>
              <option value="reasoning"><span data-i18n-key="reasoning"></span></option>
              <option value="fast"><span data-i18n-key="fast"></span></option>
              <option value="vision"><span data-i18n-key="vision"></span></option>
            </select></label>
            <label>Model <input type="text" id="chat-model" placeholder="e.g. glm-4.7" style="width:140px;"></label>
            <label>Max tokens <input type="text" id="chat-max" value="1024" style="width:70px;"></label>
            <label style="display:flex;align-items:center;gap:4px;"><input type="checkbox" id="chat-stream" checked><span data-i18n-key="stream"></span></label>
            <span class="spinner hidden" id="chat-spinner"></span>
            <span class="small" id="chat-model-badge"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- Stats -->
    <section id="stats">
      <h3 style="margin-bottom:16px;font-size:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;" data-i18n-key="statistics"></h3>
      <button class="btn" onclick="loadStats()">Refresh</button>
      <table class="stat-table">
        <thead>
          <tr><th><span data-i18n-key="model"></span></th><th><span data-i18n-key="ok"></span></th><th><span data-i18n-key="fail"></span></th><th><span data-i18n-key="429"></span></th><th><span data-i18n-key="avg_s"></span></th></tr>
        </thead>
        <tbody id="stats-models"></tbody>
      </table>
      <table class="stat-table" style="margin-top:24px;">
        <thead>
          <tr><th><span data-i18n-key="key_masked"></span></th><th><span data-i18n-key="ok"></span></th><th><span data-i18n-key="fail"></span></th><th><span data-i18n-key="429"></span></th></tr>
        </thead>
        <tbody id="stats-keys"></tbody>
      </table>
    </section>
  </main>
</div>

<script>
  // i18n messages - English is the default
  const i18nMessages = {
    // Common
    ok: 'OK',
    cancel: 'Cancel',
    save: 'Save',
    delete: 'Delete',
    edit: 'Edit',
    create: 'Create',
    close: 'Close',
    loading: 'Loading...',
    error: 'Error',
    success: 'Success',
    warning: 'Warning',
    info: 'Info',

    // Auth
    signIn: 'Sign in',
    signUp: 'Sign up',
    signOut: 'Sign out',
    email: 'Email',
    password: 'Password',
    confirmPassword: 'Confirm password',
    emailPlaceholder: 'Enter your email',
    passwordPlaceholder: 'Enter your password',
    signInButton: 'Sign in',
    signUpButton: 'Sign up',
    needAccount: "Don't have an account?",
    alreadyHaveAccount: 'Already have an account?',

    // Navigation
    home: 'Home',
    chat: 'Chat',
    models: 'Models',
    settings: 'Settings',
    profile: 'Profile',
    keys: 'API Keys',
    providers: 'Providers',
    stats: 'Stats',

    // Chat
    newChat: 'New Chat',
    sendMessage: 'Send message',
    messagePlaceholder: 'Type your message...',
    systemPrompt: 'System prompt',
    model: 'Model',
    route: 'Route',
    maxTokens: 'Max tokens',
    temperature: 'Temperature',
    stream: 'Stream',

    // Stats
    statsTitle: 'Stats',
    totalRequests: 'Total requests',
    okRequests: 'OK requests',
    failedRequests: 'Failed requests',
    cacheHits: 'Cache hits',
    avgLatency: 'Average latency',
    perModel: 'Per model',
    perKey: 'Per key',

    // Settings
    settingsTitle: 'Settings',
    language: 'Language',
    languageLabel: 'Language',
    theme: 'Theme',
    themeLabel: 'Theme',
    light: 'Light',
    dark: 'Dark',
    system: 'System',
    apiKeys: 'API Keys',
    apiKeysLabel: 'API Keys',
    providers: 'Providers',
    providersLabel: 'Providers',

    // Common actions
    saveChanges: 'Save changes',

  const i18nZhMessages = {

  function i18n(key) {
    if (currentLocale === 'zh' && i18nZhMessages[key] !== undefined) {
      return i18nZhMessages[key];
    }
    return (i18nMessages[key] || key);
  }

  // Set locale and update UI elements with data-i18n-key attributes
  function setLocale(locale) {
    currentLocale = locale;

    const messages = locale === 'zh' ? i18nZhMessages : i18nMessages;

    // Update all elements with data-i18n-key attributes
    document.querySelectorAll('[data-i18n-key]').forEach(element => {
      const key = element.getAttribute('data-i18n-key');
      if (messages[key] !== undefined) {
        element.textContent = messages[key];
      }
    });

    // Update placeholder attributes
    document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
      const key = element.getAttribute('data-i18n-placeholder');

        element.placeholder = messages[key];

    document.querySelectorAll('#locale-en, #locale-zh').forEach(btn => {

    const activeBtn = document.getElementById(`locale-${locale}`);
    if (activeBtn) {
      activeBtn.classList.add('active');

    // Update document lang attribute
    document.documentElement.lang = locale;
  }

  document.addEventListener('DOMContentLoaded', () => {

<script>
const API = '/';
let currentRoute = 'overview';

function show(id) {
  document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelector('a[href="#'+id+'"]').classList.add('active');
  currentRoute = id;
  if (id === 'stats') loadStats();
  if (id === 'overview') loadOverview();
  if (id === 'models') loadModels();
}

async function fetchJson(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function loadOverview() {
  try {
    const [health, models] = await Promise.all([fetchJson('/health'), fetchJson('/list')]);
    const keys = health.keys || [];
    const unhealthy = keys.some(k => k.status !== 'ready');
    document.getElementById('dot-health').className = 'dot ' + (unhealthy ? 'bad' : 'ok');
    document.getElementById('health-text').textContent = unhealthy ? i18n('degraded') : i18n('healthy');
    document.getElementById('health-detail').textContent = keys.length + ' key' + (keys.length !== 1 ? 's' : '') + ' — ' + (unhealthy ? i18n('some_keys_limited_dead') : i18n('all_ready'));
    document.getElementById('chip-status').innerHTML = '<span class="dot ' + (unhealthy ? 'bad' : 'ok') + '"></span>' + (unhealthy ? i18n('degraded') : i18n('online'));
    document.getElementById('chip-keys').textContent = keys.length + ' key' + (keys.length !== 1 ? 's' : '');
    document.getElementById('key-count').textContent = keys.length;
    document.getElementById('key-detail').textContent = keys.filter(k => k.status === 'ready').length + ' ready';
    const routeCount = Object.keys(models).length;
    document.getElementById('route-count').textContent = routeCount;
    document.getElementById('route-detail').textContent = i18n('allowlisted_routes');
    const kl = document.getElementById('key-list');
    kl.innerHTML = '';
    keys.forEach(k => {
      const row = document.createElement('div');
      row.className = 'key-row';
      const statusDot = '<span class="dot ' + (k.status === 'ready' ? 'ok' : k.status === 'dead' ? 'bad' : 'warn') + '"></span>';
      row.innerHTML = statusDot + '<div class="key-masked">' + escapeHtml(k.key) + '</div>' +
        '<div class="key-stats"><span>' + k.provider + '</span><span>ok=' + k.ok + '</span><span>429s=' + k['429'] + '</span></div>';
      kl.appendChild(row);
    });
  } catch (e) {
    document.getElementById('health-text').textContent = i18n('error');
    document.getElementById('health-detail').textContent = e.message;
  }
}

async function loadModels() {
  try {
    const models = await fetchJson('/list');
    const grid = document.getElementById('models-grid');
    grid.innerHTML = '';
    let any = false;
    for (const [route, list] of Object.entries(models)) {
      if (!list || list.length === 0) continue;
      any = true;
      const sec = document.createElement('div');
      sec.className = 'route-section';
      sec.innerHTML = '<h4>' + escapeHtml(route) + ' <span class="badge">' + list.length + '</span></h4><div class="model-grid" id="models-' + route + '"></div>';
      grid.appendChild(sec);
      const mg = document.getElementById('models-' + route);
      list.forEach(m => {
        const c = document.createElement('div');
        c.className = 'model-card';
        c.innerHTML = '<div class="id">' + escapeHtml(m) + '</div>';
        c.onclick = () => {
          document.getElementById('chat-model').value = m;
          show('chat');
        };
        mg.appendChild(c);
      });
    }
    if (!any) grid.innerHTML = '<div class="empty">' + i18n('no_allowlisted_models_found') + '</div>';
  } catch (e) {
    document.getElementById('models-grid').innerHTML = '<div class="error">' + i18n('error_loading_models') + ': ' + escapeHtml(e.message) + '</div>';
  }
}

async function loadStats() {
  try {
    const data = await fetchJson('/stats');
    const mb = document.getElementById('stats-models');
    const kb = document.getElementById('stats-keys');
    mb.innerHTML = '';
    kb.innerHTML = '';
    const models = data && data.models ? data.models : {};
    const keys = data && data.keys ? data.keys : {};
    let hasModels = false;
    for (const [m, v] of Object.entries(models)) {
      hasModels = true;
      const avg = v.ok ? (v.lat_sum / v.ok).toFixed(2) : '—';
      const tr = document.createElement('tr');
      tr.innerHTML = '<td class="mono">' + escapeHtml(m) + '</td><td>' + (v.ok || 0) + '</td><td>' + (v.fail || 0) + '</td><td>' + (v['429'] || 0) + '</td><td>' + avg + '</td>';
      mb.appendChild(tr);
    }
    if (!hasModels) mb.innerHTML = '<tr><td colspan="5" class="empty">' + i18n('no_model_statistics_yet') + '</td></tr>';
    let hasKeys = false;
    for (const [k, v] of Object.entries(keys)) {
      hasKeys = true;
      const tr = document.createElement('tr');
      tr.innerHTML = '<td class="mono">' + escapeHtml(k) + '</td><td>' + (v.ok || 0) + '</td><td>' + (v.fail || 0) + '</td><td>' + (v['429'] || 0) + '</td>';
      kb.appendChild(tr);
    }
    if (!hasKeys) kb.innerHTML = '<tr><td colspan="4" class="empty">' + i18n('no_key_statistics_yet') + '</td></tr>';
  } catch (e) {
    document.getElementById('stats-models').innerHTML = '<tr><td colspan="5" class="error">' + i18n('error') + ': ' + escapeHtml(e.message) + '</td></tr>';
  }
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&', '<': '<', '>': '>', '"': '"', "'': ''' })[c]);
}

// ---------- Chat ----------
const chatPrompt = document.getElementById('chat-prompt');
const chatSend = document.getElementById('chat-send');
const chatHistory = document.getElementById('chat-history');
const chatMessages = document.getElementById('chat-messages');
const chatError = document.getElementById('chat-error');
const chatSpinner = document.getElementById('chat-spinner');
const chatModelBadge = document.getElementById('chat-model-badge');

chatPrompt.addEventListener('input', () => {
  chatPrompt.style.height = 'auto';
  chatPrompt.style.height = chatPrompt.scrollHeight + 'px';
  chatSend.disabled = !chatPrompt.value.trim();
});
chatSend.disabled = true;

function addChat(role, text, model) {
  const div = document.createElement('div');
  div.className = 'chat-msg ' + role;
  if (model && role === 'assistant') {
    const badge = document.createElement('span');
    badge.className = 'model';
    badge.textContent = model;
    div.appendChild(badge);
  }
  const p = document.createElement('div');
  p.textContent = text;
  div.appendChild(p);
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return div;
}

function setSending(s) {
  chatSend.disabled = s || !chatPrompt.value.trim();
  chatPrompt.disabled = s;
  chatSpinner.classList.toggle('hidden', !s);
}

async function sendChat() {
  const text = chatPrompt.value.trim();
  if (!text) return;
  chatPrompt.value = '';
  chatPrompt.style.height = 'auto';
  addChat('user', text);
  setSending(true);
  chatError.textContent = '';

  const body = {
    model: document.getElementById('chat-model').value.trim() || 'auto',
    messages: [{ role: 'user', content: text }],
    stream: document.getElementById('chat-stream').checked,
    max_tokens: parseInt(document.getElementById('chat-max').value) || 1024,
    route: document.getElementById('chat-route').value,
  };

  try {
    if (body.stream) {
      const res = await fetch('/v1/chat/completions', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      chatModelBadge.textContent = 'model: ' + (res.headers.get('x-router-model') || body.model);
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let assistant = null, buffer = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n\n');
        buffer = lines.pop() || '';
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6);
          if (payload === '[DONE]') continue;
          try {
            const chunk = JSON.parse(payload);
            const delta = chunk.choices?.[0]?.delta?.content || '';
            if (delta) {
              if (!assistant) assistant = addChat('assistant', '', res.headers.get('x-router-model') || body.model);
              assistant.lastChild.textContent += delta;
              chatMessages.scrollTop = chatMessages.scrollHeight;
            }
          } catch (_) {}
        }
      }
    } else {
      const res = await fetch('/v1/chat/completions', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error?.message || 'HTTP ' + res.status);
      }
      const data = await res.json();
      const text = data.choices?.[0]?.message?.content || '(no response)';
      addChat('assistant', text, res.headers.get('x-router-model') || body.model);
    }
  } catch (e) {
    chatError.textContent = e.message;
    addChat('system', i18n('error') + ': ' + e.message);
  } finally {
    setSending(false);
  }
}

chatSend.addEventListener('click', sendChat);
chatPrompt.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } });

// Poll health every 20s
setInterval(loadOverview, 20000);
loadOverview();
</script>
